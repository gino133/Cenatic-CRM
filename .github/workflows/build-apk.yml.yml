name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools & Platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          # Tự động tìm thư mục chứa tệp settings.gradle.kts
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Searching for settings.gradle..."
            SETTINGS_FILE=$(find . -name "settings.gradle" | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Không tìm thấy file settings.gradle.kts trong repository!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Tìm thấy mã nguồn Android tại thư mục: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Chuẩn bị file .env
          if [ ! -f .env ]; then
            touch .env
          fi
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

          # Chuẩn bị file keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Thực hiện đóng gói APK
          gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cenatic-CRM-Debug-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/*.apk
